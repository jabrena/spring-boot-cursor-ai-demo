spring.application.name=demo
spring.datasource.url=jdbc:postgresql://localhost:5432/sakila
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Enable automatic restart (true by default)
spring.devtools.restart.enabled=true

# Optional: Exclude specific folders from triggering restart
# spring.devtools.restart.exclude=static/**,public/**

# Optional: Add additional paths to watch
spring.devtools.restart.additional-paths=src/main/resources/templates

# Optional: Configure trigger file (if you want to control restart manually)
# spring.devtools.restart.trigger-file=.reloadtrigger
